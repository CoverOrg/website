[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", features =["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = {version = "10.4.0", features = ["rust_crypto"]}
rand = "0.10.1"
serde = { version = "1.0.228", features=["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "tls-native-tls", "chrono", "macros"] }
tera = "1.20.1"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["fs"] }
uuid = { version = "1.23.1", features = ["serde", "v7"] }
